<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>印库 · 登录</title>
<script src="auth.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(135deg,#eef1f8,#e7ecff);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#1f2430}
  .card{width:min(380px,90vw);background:rgba(255,255,255,.8);backdrop-filter:blur(18px);
    border:1px solid rgba(20,30,60,.1);border-radius:18px;padding:28px;box-shadow:0 24px 60px rgba(20,30,60,.18)}
  h1{font-size:20px;font-weight:600;margin-bottom:4px}
  .sub{font-size:13px;color:#9aa3b5;margin-bottom:20px}
  label{display:block;font-size:12px;color:#5b6478;margin:14px 0 5px}
  input{width:100%;padding:11px 12px;border:1px solid rgba(20,30,60,.12);border-radius:12px;font-size:14px;font-family:inherit;background:rgba(255,255,255,.7)}
  input:focus{outline:none;border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.15)}
  .btns{display:flex;gap:10px;margin-top:20px}
  button{flex:1;padding:12px;border:none;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer}
  .b-reg{background:#e7ecff;color:#3b3fae}
  .b-login{background:#6366f1;color:#fff}
  .hint{font-size:12px;min-height:16px;margin-top:12px;text-align:center;color:#b4690e}
</style>
</head>
<body>
<div class="card">
  <h1>印库</h1>
  <div class="sub">登录后开始你的刷题书架</div>
  <label>用户名</label>
  <input id="username" placeholder="取个名字">
  <label>密码</label>
  <input id="password" type="password" placeholder="至少 6 位">
  <div class="btns">
    <button class="b-reg" onclick="doRegister()">注册</button>
    <button class="b-login" onclick="doLogin()">登录</button>
  </div>
  <div class="hint" id="hint"></div>
</div>
<script>
const API="http://127.0.0.1:8000";
function setUid(uid, token){
  localStorage.setItem("yinku_uid", uid);
  if (token) localStorage.setItem("yinku_token", token);
  location.href="bookshelf.html";
}
async function doRegister(){
  const username=document.getElementById("username").value.trim();
  const password=document.getElementById("password").value;
  const hint=document.getElementById("hint");
  if(!username||!password){ hint.textContent="用户名和密码都要填"; return; }
  const r=await fetch(API+"/auth/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,password})});
  const j=await r.json();
  if(r.status!==200){ hint.textContent="❌ "+(j.error||"注册失败"); return; }
  setUid(j.user_id, j.token);
}
async function doLogin(){
  const username=document.getElementById("username").value.trim();
  const password=document.getElementById("password").value;
  const hint=document.getElementById("hint");
  const r=await fetch(API+"/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,password})});
  const j=await r.json();
  if(r.status!==200){ hint.textContent="❌ "+(j.error||"登录失败"); return; }
  setUid(j.user_id, j.token);
}
</script>
</body>
</html>
